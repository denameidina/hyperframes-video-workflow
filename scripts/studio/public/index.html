<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio</title>
<link rel="stylesheet" href="/vendor/xterm/xterm.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header>
  <h1>Studio</h1>
  <nav>
    <button data-tab="projects" class="active">Projects</button>
    <button data-tab="shared">Shared</button>
    <button data-tab="sessions">Sessions</button>
    <button data-tab="results">Results</button>
    <button data-tab="voice">Suara</button>
    <button data-tab="music">Musik</button>
  </nav>
</header>
<p id="banner" hidden></p>
<main>
  <section id="tab-projects">
    <div id="project-home">
      <form id="project-create" class="bar">
        <input name="slug" required pattern="[a-z0-9][a-z0-9\-]*" placeholder="slug-project-baru" autocapitalize="off" autocomplete="off">
        <button class="primary">Buat project</button>
      </form>
      <ul id="project-list" class="list"></ul>
    </div>
    <div id="project-detail" hidden>
      <div class="bar">
        <button id="project-back">← Projects</button>
        <strong id="project-title"></strong>
      </div>
      <div class="bar">
        <label class="btn primary">Upload video/gambar<input id="source-upload" type="file" multiple accept="video/mp4,video/quicktime,.mp4,.mov,.m4v,image/png,image/jpeg,image/webp" hidden></label>
        <button id="project-attach">Tambah dari Shared</button>
        <button id="project-session" class="primary">Mulai sesi</button>
        <button id="project-delete" class="danger">Hapus project</button>
        <progress id="source-progress" max="1" value="0" hidden></progress>
      </div>
      <ul id="source-list" class="list"></ul>
    </div>
  </section>
  <section id="tab-shared" hidden>
    <div class="bar">
      <label class="btn primary">Upload ke Shared<input id="shared-upload" type="file" multiple accept="video/mp4,video/quicktime,.mp4,.mov,.m4v,image/png,image/jpeg,image/webp" hidden></label>
      <progress id="shared-progress" max="1" value="0" hidden></progress>
    </div>
    <ul id="shared-list" class="list"></ul>
  </section>
  <section id="tab-sessions" hidden><ul id="session-list" class="list"></ul></section>
  <section id="tab-results" hidden><ul id="result-list" class="list"></ul></section>
  <section id="tab-voice" hidden>
    <div id="voice-home"><ul id="voice-list" class="list"></ul></div>
    <div id="voice-detail" hidden>
      <div class="bar">
        <button id="voice-back">← Uji dengar</button>
        <strong id="voice-title"></strong>
      </div>
      <p class="muted">Dengarkan tiap sampel sekali lewat speaker HP dan sekali lewat headset. Nilai 1–5, kosongkan bila belum yakin. Nama suara baru dibuka setelah <code>npm run voice -- test reveal</code>.</p>
      <div id="voice-ref"></div>
      <ul id="voice-samples" class="list"></ul>
      <div class="bar"><button id="voice-save" class="primary">Simpan penilaian</button><span id="voice-saved" class="muted"></span></div>
    </div>
  </section>
  <section id="tab-music" hidden><ul id="music-list" class="list"></ul></section>
</main>

<dialog id="edit-dialog">
  <form method="dialog" id="edit-form">
    <h2>Sesi agen <span id="edit-slug"></span></h2>
    <label>Runtime <select name="runtime"><option value="claude">Claude</option><option value="codex">Codex</option></select></label>
    <label>Model <select name="model" required></select></label>
    <label>Effort <select name="effort"></select></label>
    <label>Catatan <textarea name="notes" rows="4" placeholder="Arahan opsional untuk agen"></textarea></label>
    <p class="error" id="edit-error"></p>
    <menu><button value="cancel" formnovalidate>Batal</button><button value="start" class="primary">Mulai sesi</button></menu>
  </form>
</dialog>

<dialog id="attach-dialog">
  <form method="dialog" id="attach-form">
    <h2>Tambah dari Shared</h2>
    <ul id="attach-list" class="checks"></ul>
    <p class="error" id="attach-error"></p>
    <menu><button value="cancel" formnovalidate>Batal</button><button value="attach" class="primary">Tambahkan</button></menu>
  </form>
</dialog>

<dialog id="publish-dialog">
  <form method="dialog" id="publish-form">
    <h2>Publish ke Repliz</h2>
    <p><strong id="publish-file"></strong></p>
    <p id="publish-targets" class="muted"></p>
    <pre id="publish-caption"></pre>
    <pre id="publish-log" hidden></pre>
    <p class="error" id="publish-error"></p>
    <menu><button value="cancel" formnovalidate>Tutup</button><button value="publish" class="primary" id="publish-go">Konfirmasi publish</button></menu>
  </form>
</dialog>

<div id="term-panel" hidden>
  <div class="term-head"><strong id="term-title"></strong><button id="term-close">Tutup</button></div>
  <div id="term"></div>
  <div class="keys">
    <button data-key="esc">Esc</button><button data-key="tab">Tab</button><button data-key="up">↑</button>
    <button data-key="down">↓</button><button data-key="ctrlc">Ctrl-C</button><button data-key="enter">Enter</button>
  </div>
</div>

<script src="/vendor/xterm/xterm.js"></script>
<script src="/vendor/xterm/addon-fit.js"></script>
<script src="/app.js"></script>
</body>
</html>
