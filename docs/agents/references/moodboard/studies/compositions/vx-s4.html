<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <!-- Study only: the Ken Burns effect (City of Gold, 1957) — a slow push across an archival photo, with its date and source. Self-made with the kit to show the technique; not a copy of the original work, and the words are invented. -->
    <template>
      <style>
        #root { position: absolute; inset: 0; }
        #win { position: absolute; inset: 0; overflow: hidden; background: #111; }
        #cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
        #cam img { position: absolute; left: -260px; top: -60px; width: 1600px; height: 2074px; filter: sepia(.45) contrast(1.05); }
        #vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,.55)); }
        #d { position: absolute; left: 90px; top: 1560px; font-size: 84px; color: #f4efe6; }
        #src { left: 90px; top: 1700px; }
      </style>
      <div id="root" data-composition-id="vx-s4" data-width="1080" data-height="1920" data-duration="3">
        <div class="sk-stage sk-vox">
          <div id="win"><div id="cam"><img src="assets/px-archive-plate.jpg" alt="" /><img src="assets/px-archive-subject.png" alt="" /></div><div id="vig"></div></div>
          <div class="sk-serif" id="d">±1900</div>
          <div class="sk-source" id="src">Foto: "Woman typist", Library of Congress (domain publik)</div>
          <div class="sk-grain" id="grain"></div>
        </div>
      </div>
      <script>
        (() => {
          const ID = 'vx-s4';
          const $ = SK.finder(ID);
          SK.clip(ID, { T: 3, update: (t) => { SK.cam($('cam'), 1 + 0.06 * M.eo(M.clamp(t / 3)), 560, 900 + 60 * M.eo(M.clamp(t / 3))); SK.grain($('grain'), t, 4); } });
        })();
      </script>
    </template>
  </body>
</html>
