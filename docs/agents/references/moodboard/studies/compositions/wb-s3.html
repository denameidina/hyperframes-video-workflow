<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <!-- Study only: Common Craft "Paperworks" (Twitter in Plain English, 2008) — paper cut-outs slid onto a whiteboard. Self-made with the kit to show the technique; not a copy of the original work, and the words are invented. -->
    <template>
      <style>
        #root { position: absolute; inset: 0; }
        .o { position: absolute; left: 0; top: 0; }
        #ink { position: absolute; left: 0; top: 0; }
        .h { position: absolute; font-size: 60px; font-weight: 700; color: #151515; white-space: nowrap; }
      </style>
      <div id="root" data-composition-id="wb-s3" data-width="1080" data-height="1920" data-duration="3">
        <div class="sk-stage sk-wb">
          <svg class="sk-full" id="ink" viewBox="0 0 1080 1920" width="1080" height="1920"></svg>
          <div class="o sk-cut sk-obj-chat-bubble" id="o0" style="width:300px"></div>
          <div class="o sk-cut sk-obj-calculator" id="o1" style="width:250px"></div>
          <div class="o sk-cut sk-obj-coin-stack" id="o2" style="width:280px"></div>
          <div class="h" style="left:120px;top:1600px">order masuk → dihitung → cuan</div>
        </div>
      </div>
      <script>
        (() => {
          const ID = 'wb-s3';
          const $ = SK.finder(ID);
          const A = [SK.arrow(420, 700, 560, 860, 611), SK.arrow(640, 1060, 520, 1200, 612)];
          $('ink').innerHTML = A.map((a) => `<path class="sk-stroke" d="${a.shaft}"/><path class="sk-stroke" d="${a.head}"/>`).join('');
          const P = [...$('ink').querySelectorAll('path')];
          const O = [[0.1, 110, 420], [0.7, 600, 800], [1.3, 250, 1130]];
          SK.clip(ID, { T: 3, update: (t) => {
            O.forEach(([at, x, y], i) => { const u = M.eo(M.clamp((t - at) / 0.45)); $('o' + i).style.transform = `translate(${(x + (1 - u) * (i % 2 ? 900 : -900)).toFixed(1)}px, ${y}px)`; });
            P.forEach((p, i) => SK.draw(p, M.clamp((t - 1.8 - i * 0.2) / 0.25)));
          } });
        })();
      </script>
    </template>
  </body>
</html>
