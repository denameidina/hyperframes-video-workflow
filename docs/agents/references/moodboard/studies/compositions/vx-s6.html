<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <!-- Study only: Vox-style edits (EarnEdits) — clippings stacked with a date label and a stamp. Self-made with the kit to show the technique; not a copy of the original work, and the words are invented. -->
    <template>
      <style>
        #root { position: absolute; inset: 0; }
        .dc { position: absolute; left: 0; top: 0; }
        #date { position: absolute; left: 120px; top: 290px; font-size: 64px; font-weight: 800; color: #fff; background: #1b1b1b; padding: 8px 22px; }
        #stampW { position: absolute; left: 560px; top: 1340px; transform: rotate(-10deg); }
        #stamp { display: inline-block; padding: 10px 26px; border: 8px solid #d7263d; color: #d7263d; font-size: 96px; line-height: 1; mix-blend-mode: multiply; }
      </style>
      <div id="root" data-composition-id="vx-s6" data-width="1080" data-height="1920" data-duration="3">
        <div class="sk-stage sk-vox sk-paper-grey">
          <div class="dc sk-cut" id="c0"></div><div class="dc sk-cut" id="c1"></div><div class="dc sk-cut" id="c2"></div>
          <div class="sk-sans" id="date">MARET 2024</div>
          <div id="stampW"><div class="sk-display" id="stamp">DICEK</div></div>
        </div>
      </div>
      <script>
        (() => {
          const ID = 'vx-s6';
          const $ = SK.finder(ID);
          const H = ['Order online naik', 'Admin lembur tiap malam', 'Pelanggan mulai kabur'];
          H.forEach((h, i) => { $('c' + i).innerHTML = SK.doc('article', { kicker: 'Catatan toko', headline: h, body: ['Ringkasan singkat.'] }, { w: 640 }); });
          const P = [[150, 480, -5, 0.2], [290, 820, 4, 0.6], [180, 1130, -2, 1.0]];
          SK.clip(ID, { T: 3, update: (t) => {
            P.forEach(([x, y, r, at], i) => { const k = 1 - M.eo(M.clamp((t - at) / 0.3)); $('c' + i).style.transform = `translate(${x}px, ${(y - 200 * k).toFixed(1)}px) rotate(${r + 8 * k}deg)`; $('c' + i).style.opacity = t >= at ? '1' : '0'; });
            SK.enter($('stamp'), t - 1.8, 'slam');
          } });
        })();
      </script>
    </template>
  </body>
</html>
