<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <!-- Study only: Vertigo (1958) — the dolly zoom: the subject plane holds its size while the corridor behind stretches, caught mid-move. Self-made with the kit to show the technique; not a copy of the original work, and the words are invented. -->
    <template>
      <style>
        #root { position: absolute; inset: 0; }
        #bg { position: absolute; inset: 0; background: #0b1320; }
      </style>
      <div id="root" data-composition-id="px-s6" data-width="1080" data-height="1920" data-duration="3">
        <div class="sk-stage sk-stop">
          <div id="bg"></div>
          <div class="sk-view" id="view"><div class="sk-world" id="world">
            <div class="sk-ly" id="back"><img class="sk-plate" src="vendor/asset-lib/scenes/server-room/plate.webp" alt="" /></div>
            <div class="sk-ly" id="mid"><img class="sk-plate" src="vendor/asset-lib/scenes/server-room/mid.png" alt="" /></div>
            <div class="sk-ly" id="front"><img class="sk-plate" src="vendor/asset-lib/scenes/server-room/front.png" alt="" /></div>
          </div></div>
        </div>
      </div>
      <script>
        (() => {
          const ID = 'px-s6';
          const $ = SK.finder(ID);
          const Z0 = -500, P0 = SK.P;
          [['back', -1400, 2.2], ['mid', Z0, 1.3], ['front', -80, 1.06]].forEach(([id, z, f]) => SK.layer($(id), z, { fill: f }));
          const u = M.track(0, [[0.3, 1, [2.7, 1]]]);
          SK.clip(ID, { T: 3, update: (t) => {
            const { P, d } = SK.dollyZoom(u(t), { P0, z0: Z0, d1: 240 });
            $('view').style.perspective = P.toFixed(1) + 'px';
            SK.camera($('world'), { z: d });
          } });
        })();
      </script>
    </template>
  </body>
</html>
