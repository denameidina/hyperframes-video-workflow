<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <!-- Study only: the Takahashi method (Masayoshi Takahashi) — one enormous word fills the frame. Self-made with the kit to show the technique; not a copy of the original work, and the words are invented. -->
    <template>
      <style>
        #root { position: absolute; inset: 0; }
        #bg { position: absolute; inset: 0; background: #ffffff; }
        #w { position: absolute; left: 0; right: 0; top: 540px; text-align: center; font-size: 520px; line-height: .9; color: #111; }
        #s { position: absolute; left: 0; right: 0; top: 1060px; text-align: center; font-size: 60px; color: #777; }
      </style>
      <div id="root" data-composition-id="tx-s6" data-width="1080" data-height="1920" data-duration="3">
        <div class="sk-stage sk-text">
          <div id="bg"></div>
          <div class="sk-display" id="w">CUAN</div>
          <div class="sk-sans" id="s">(satu kata, satu layar)</div>
        </div>
      </div>
      <script>
        (() => {
          const ID = 'tx-s6';
          const $ = SK.finder(ID);
          SK.clip(ID, { T: 3, update: (t) => { SK.enter($('w'), t - 0.2, 'slam'); SK.enter($('s'), t - 1.2, 'fade'); } });
        })();
      </script>
    </template>
  </body>
</html>
