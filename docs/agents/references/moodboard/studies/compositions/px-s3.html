<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <!-- Study only: Yuri Norstein, Hedgehog in the Fog (1975) — soft fog sheets between the planes, drifting at different speeds. Self-made with the kit to show the technique; not a copy of the original work, and the words are invented. -->
    <template>
      <style>
        #root { position: absolute; inset: 0; }
        .fog { position: absolute; left: -500px; width: 2080px; height: 620px; border-radius: 50%; filter: blur(46px); }
        #f1 { top: 760px; background: radial-gradient(ellipse, rgba(240,236,226,.9), rgba(240,236,226,0) 70%); }
        #f2 { top: 1180px; background: radial-gradient(ellipse, rgba(230,226,236,.85), rgba(230,226,236,0) 70%); }
      </style>
      <div id="root" data-composition-id="px-s3" data-width="1080" data-height="1920" data-duration="3">
        <div class="sk-stage sk-stop sk-grade-px-faded-film">
          <div class="sk-view" id="view"><div class="sk-world" id="world">
            <div class="sk-ly" id="back"><img class="sk-plate" src="vendor/asset-lib/scenes/street-motor/plate.webp" alt="" /></div>
            <div class="sk-ly" id="h1"><div class="fog" id="f1"></div></div>
            <div class="sk-ly" id="mid"><img class="sk-plate" src="vendor/asset-lib/scenes/street-motor/mid.png" alt="" /></div>
            <div class="sk-ly" id="h2"><div class="fog" id="f2"></div></div>
            <div class="sk-ly" id="front"><img class="sk-plate" src="vendor/asset-lib/scenes/street-motor/front.png" alt="" /></div>
          </div></div>
          <div class="sk-haze"></div>
          <div class="sk-grain" id="grain"></div>
        </div>
      </div>
      <script>
        (() => {
          const ID = 'px-s3';
          const $ = SK.finder(ID);
          const L = [['back', -1400, 1.2], ['h1', -900, 1.06], ['mid', -500, 1.06], ['h2', -280, 1.06], ['front', -80, 1.06]];
          L.forEach(([id, z, f]) => SK.layer($(id), z, { fill: f }));
          SK.clip(ID, { T: 3, update: (t) => {
            SK.camera($('world'), { z: 40 * t });
            $('f1').style.transform = `translateX(${(-20 + 18 * t).toFixed(1)}px)`;
            $('f2').style.transform = `translateX(${(50 - 40 * t).toFixed(1)}px)`;
            SK.dof([{ el: $('back'), z: -1400 }, { el: $('front'), z: -80 }], -500, { k: 200, max: 4 });
            SK.grain($('grain'), t, 3);
          } });
        })();
      </script>
    </template>
  </body>
</html>
