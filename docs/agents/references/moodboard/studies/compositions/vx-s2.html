<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <!-- Study only: a Vox science videogram (the first black-hole photo) — a labelled, numbered diagram drawn on paper. Self-made with the kit to show the technique; not a copy of the original work, and the words are invented. -->
    <template>
      <style>
        #root { position: absolute; inset: 0; }
        #ink { position: absolute; left: 0; top: 0; }
        .lb { position: absolute; font-size: 42px; font-weight: 700; color: #1b1b1b; white-space: nowrap; }
        .n { position: absolute; width: 60px; height: 60px; border-radius: 50%; background: #d7263d; color: #fff; font-size: 36px; font-weight: 800; text-align: center; line-height: 60px; }
        #t { position: absolute; left: 90px; top: 300px; font-size: 70px; color: #1b1b1b; }
        #tag { right: 40px; top: 1780px; }
      </style>
      <div id="root" data-composition-id="vx-s2" data-width="1080" data-height="1920" data-duration="3">
        <div class="sk-stage sk-vox sk-grid">
          <div class="sk-serif" id="t">Alur pesanan, dibedah</div>
          <svg class="sk-full" id="ink" viewBox="0 0 1080 1920" width="1080" height="1920"></svg>
          <div class="n" style="left:180px;top:620px">1</div><div class="lb sk-sans" style="left:260px;top:628px">chat masuk</div>
          <div class="n" style="left:720px;top:960px">2</div><div class="lb sk-sans" style="left:860px;top:940px;line-height:1.1">dicatat<br>otomatis</div>
          <div class="n" style="left:180px;top:1300px">3</div><div class="lb sk-sans" style="left:260px;top:1308px">dikirim + ditagih</div>
          <div class="sk-tag" id="tag">Ilustrasi</div>
        </div>
      </div>
      <script>
        (() => {
          const ID = 'vx-s2';
          const $ = SK.finder(ID);
          const ring = SK.ellipse(540, 1000, 300, 300, 811, 0.03);
          const a1 = SK.arrow(330, 720, 700, 930, 812), a2 = SK.arrow(700, 1080, 330, 1300, 813);
          $('ink').innerHTML = `<path d="${ring}" fill="none" stroke="#1b1b1b" stroke-width="6" stroke-dasharray="14 12"/>` + [a1, a2].map((a) => `<path id="" d="${a.shaft} ${a.head}" fill="none" stroke="#d7263d" stroke-width="7" stroke-linecap="round"/>`).join('');
          const P = [...$('ink').querySelectorAll('path')];
          SK.clip(ID, { T: 3, update: (t) => P.forEach((p, i) => SK.draw(p, M.clamp((t - 0.2 - i * 0.4) / 0.6))) });
        })();
      </script>
    </template>
  </body>
</html>
