<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <!-- Study only: Hannah Höch, photomontage (1919) — photo fragments at clashing scales, a figure with a machine for a head, mixed type. Self-made with the kit to show the technique; not a copy of the original work, and the words are invented. -->
    <template>
      <style>
        #root { position: absolute; inset: 0; }
        .ph { position: absolute; left: 0; top: 0; background-size: cover; filter: grayscale(1) contrast(1.15); }
        #fig { position: absolute; left: 0; top: 0; width: 1300px; filter: grayscale(1) contrast(1.3) drop-shadow(8px 10px 0 rgba(0,0,0,.35)); }
        #head { position: absolute; left: 0; top: 0; width: 290px; }
        .w { position: absolute; left: 0; top: 0; line-height: 1; padding: 4px 14px; }
      </style>
      <div id="root" data-composition-id="mm-s1" data-width="1080" data-height="1920" data-duration="3">
        <div class="sk-stage sk-stop sk-paper-cream">
          <div class="ph sk-cut" id="a" style="width:760px;height:900px;background-image:url(vendor/asset-lib/scenes/server-room/plate.webp)"></div>
          <div class="ph sk-cut" id="b" style="width:620px;height:520px;background-image:url(vendor/asset-lib/scenes/city-dusk/plate.webp);background-position:50% 20%"></div>
          <div class="ph sk-cut" id="c" style="width:420px;height:420px;border-radius:50%;background-image:url(vendor/asset-lib/scenes/street-motor/plate.webp)"></div>
          <img class="sk-cut" id="fig" src="assets/px-archive-subject.png" alt="" />
          <div class="sk-cut sk-obj-ai-chip" id="head"></div>
          <div class="w sk-display sk-cut" id="w0" style="font-size:150px;background:#111;color:#f2ead8">KERJA</div>
          <div class="w sk-serif sk-cut" id="w1" style="font-size:96px;background:#c8102e;color:#fff;font-style:italic">mesin</div>
          <div class="w sk-mono sk-cut" id="w2" style="font-size:64px;background:#f2ead8;color:#111;border:4px solid #111">admin = ?</div>
          <div class="sk-grain" id="grain"></div>
        </div>
      </div>
      <script>
        (() => {
          const ID = 'mm-s1';
          const $ = SK.finder(ID);
          $('a').style.clipPath = SK.torn(760, 900, 721, { amp: 14 });
          $('b').style.clipPath = SK.torn(620, 520, 722, { amp: 12 });
          const P = [['a', 360, 140, 6], ['b', -60, 760, -9], ['c', 640, 1440, 0], ['fig', -520, 330, 0], ['head', 250, 860, -14], ['w0', 60, 240, -4], ['w1', 600, 1130, 7], ['w2', 90, 1640, -3]];
          SK.clip(ID, { T: 3, update: (t) => { P.forEach(([id, x, y, r], i) => SK.piece($(id), { x, y, r, s: id === 'head' ? 1 + 0.25 * (1 - M.eo(M.clamp((t - 0.8) / 0.4))) : 1 }, 723 + i, t, { amp: 1 })); SK.grain($('grain'), t, 4); } });
        })();
      </script>
    </template>
  </body>
</html>
