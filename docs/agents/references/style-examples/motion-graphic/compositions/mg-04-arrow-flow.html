<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <!-- Example only: labels are invented to show the mechanism. In a real clip every label comes from the transcript (Gate 2 R1). -->
    <template>
      <style>
        #root { position: absolute; inset: 0; }
        #panel { position: absolute; left: 70px; top: 140px; width: 940px; height: 540px; border-radius: 40px; background: var(--sk-bg); box-shadow: 0 24px 60px -20px rgba(0,0,0,.45); transform-origin: 50% 50%; }
        .node { position: absolute; top: 120px; width: 170px; height: 170px; border-radius: 85px; background: #ffffff; border: 4px solid var(--sk-ink); display: flex; align-items: center; justify-content: center; }
        .node.hot { background: var(--sk-accent); border-color: var(--sk-accent); }
        .lab { position: absolute; top: 312px; width: 240px; text-align: center; font-size: 44px; font-weight: 700; color: var(--sk-ink); }
        #wires { position: absolute; left: 0; top: 0; }
      </style>
      <div id="root" data-composition-id="mg-04-arrow-flow" data-width="1080" data-height="1920" data-duration="6">
        <div class="sk-stage sk-mg">
          <div id="panel">
            <svg id="wires" viewBox="0 0 940 540" width="940" height="540">
              <path id="a0" class="sk-stroke" d="M275 205 L365 205" style="stroke:var(--sk-ink);stroke-width:6" />
              <path id="h0" class="sk-stroke" d="M345 187 L367 205 L345 223" style="stroke:var(--sk-ink);stroke-width:6" />
              <path id="a1" class="sk-stroke" d="M575 205 L665 205" style="stroke:var(--sk-ink);stroke-width:6" />
              <path id="h1" class="sk-stroke" d="M645 187 L667 205 L645 223" style="stroke:var(--sk-ink);stroke-width:6" />
              <path id="loop" class="sk-stroke" d="M755 390 C755 490 185 490 185 390" style="stroke:var(--sk-accent-2);stroke-width:6" />
              <path id="hl" class="sk-stroke" d="M167 410 L185 388 L203 410" style="stroke:var(--sk-accent-2);stroke-width:6" />
            </svg>
            <div class="node" id="n0" style="left:100px"></div>
            <div class="node" id="n1" style="left:385px"></div>
            <div class="node hot" id="n2" style="left:670px"></div>
            <div class="lab" id="t0" style="left:65px">Chat</div>
            <div class="lab" id="t1" style="left:350px">Dicatat</div>
            <div class="lab" id="t2" style="left:635px">Beres</div>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const ID = 'mg-04-arrow-flow';
          const $ = SK.finder(ID);
          $('n0').innerHTML = M.icon('message', 80, '#1c1917', 2.4);
          $('n1').innerHTML = M.icon('file', 80, '#1c1917', 2.4);
          $('n2').innerHTML = M.icon('check', 88, '#ffffff', 2.8);
          const panel = M.track(0, [[0.05, 1, [18, 0.75]]]);
          const S = [
            { el: $('a0'), at: 1.15, dur: 0.25 }, { el: $('h0'), at: 1.38, dur: 0.12 },
            { el: $('a1'), at: 2.05, dur: 0.25 }, { el: $('h1'), at: 2.28, dur: 0.12 },
            { el: $('loop'), at: 3.5, dur: 0.7 }, { el: $('hl'), at: 4.15, dur: 0.12 },
          ];
          SK.clip(ID, { T: 6, bg: null, update: (t) => {
            const p = panel(t);
            $('panel').style.opacity = M.clamp(p * 3).toFixed(4);
            $('panel').style.transform = `scale(${(0.92 + 0.08 * p).toFixed(4)})`;
            SK.drawSeq(t, S);
            [0.4, 1.5, 2.4].forEach((at, i) => { SK.enter($('n' + i), t - at, 'pop'); SK.enter($('t' + i), t - at - 0.1, 'rise'); });
            const spin = M.eo((t - 4.25) / 0.5);
            $('n0').style.transform += ` rotate(${(spin * 360).toFixed(2)}deg)`;
          } });
        })();
      </script>
    </template>
  </body>
</html>
