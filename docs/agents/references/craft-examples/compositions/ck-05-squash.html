<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <!-- Example only: squash. Text is invented to show the mechanism; in a real clip every word comes from the transcript (Gate 2 R1). Mode: GSAP timeline (CK.add). -->
    <template>
      <div id="root" data-composition-id="ck-05-squash" data-width="1080" data-height="1920" data-duration="2.4">
        <div class="cx-stage sk-sans">
          <div class="cx-label">squash</div>
          <div class="cx-pill" id="pill">Mulai sekarang</div>
        </div>
      </div>
      <script>
        (() => {
          const ID = 'ck-05-squash';
          const root = document.querySelector('[data-composition-id="ck-05-squash"]');
          const $ = (sel) => root.querySelector(sel);
          const tl = gsap.timeline({ paused: true });
          CK.add(tl, $('#pill'), 'squash', 0.2);
          tl.to({}, { duration: 2.4 }, 0);
          window.__timelines = window.__timelines || {};
          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
