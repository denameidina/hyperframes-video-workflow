          <div class="cx-label">sharpen</div>
          <div class="cx-headline" id="head">Fokus</div>
        </div>
      </div>
      <script>
        (() => {
          const ID = 'ck-08-sharpen';
          const $ = SK.finder(ID);
          SK.clip(ID, { T: 2.4, bg: null, update: (t) => {
            CK.at($('head'), 'sharpen', t - 0.5);
          } });
        })();
      </script>
    </template>
