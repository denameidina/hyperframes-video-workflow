<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <!-- Example only: clip. Text is invented to show the mechanism; in a real clip every word comes from the transcript (Gate 2 R1). Mode: update(t) inside SK.clip (CK.at). -->
    <template>
      <div id="root" data-composition-id="ck-10-clip" data-width="1080" data-height="1920" data-duration="2.4">
        <div class="sk-stage cx-stage sk-sans">
          <div class="cx-label">clip</div>
          <div class="cx-panel" id="p0" style="top:420px">inset</div>
          <div class="cx-panel" id="p1" style="top:820px">circle</div>
          <div class="cx-panel" id="p2" style="top:1220px">wipe</div>
        </div>
      </div>
      <script>
        (() => {
          const ID = 'ck-10-clip';
          const $ = SK.finder(ID);
          SK.clip(ID, { T: 2.4, bg: null, update: (t) => {
            CK.at($('p0'), 'clip', t - 0.2, { radius: 40 });
            CK.at($('p1'), 'clip', t - 0.45, { shape: 'circle' });
            CK.at($('p2'), 'clip', t - 0.7, { shape: 'wipe' });
          } });
        })();
      </script>
    </template>
  </body>
</html>
