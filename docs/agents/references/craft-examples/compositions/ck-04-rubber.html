<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <!-- Example only: rubber. Text is invented to show the mechanism; in a real clip every word comes from the transcript (Gate 2 R1). Mode: update(t) inside SK.clip (CK.at). -->
    <template>
      <div id="root" data-composition-id="ck-04-rubber" data-width="1080" data-height="1920" data-duration="2.4">
        <div class="sk-stage cx-stage sk-sans">
          <div class="cx-label">rubber</div>
          <div class="cx-bars"><i id="b0" style="height:220px"></i><i id="b1" style="height:420px"></i><i id="b2" style="height:640px"></i></div>
          <div class="cx-rule" id="rule"></div>
        </div>
      </div>
      <script>
        (() => {
          const ID = 'ck-04-rubber';
          const $ = SK.finder(ID);
          const bars = ['b0', 'b1', 'b2'].map($);
          SK.clip(ID, { T: 2.4, bg: null, update: (t) => {
            CK.at(bars, 'rubber', t - 0.2, { axis: 'y', stagger: 0.12 });
            CK.at($('rule'), 'rubber', t - 0.1);
          } });
        })();
      </script>
    </template>
  </body>
</html>
